name: Release

# Publish a GitHub Release whose tag is vX.Y.Z (same as "version" in
# extension/manifest.json). This job builds the ready-to-install zip
# (manifest.json at the root) and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check that the tag matches manifest.json
        run: |
          MANIFEST="$(jq -r .version extension/manifest.json)"
          if [ "${TAG#v}" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST"; exit 1
          fi

      - name: Build zip
        run: cd extension && zip -r "../midas-$TAG.zip" . -x '.*'

      - name: Attach zip and install notes
        env:
          NOTES: |
            ### Install
            1. Download **midas-${{ github.event.release.tag_name }}.zip** below and extract it to a folder you'll keep (e.g. `Documents\Midas`).
            2. Open **COMO-INSTALAR.html** in that folder: a step-by-step guide in Portuguese, English and Spanish.
            3. Short version: `chrome://extensions` → turn on **Developer mode** → **Load unpacked** → pick the folder that has `manifest.json`.

            ### Update
            Midas shows a gold card when a new version is out. Click **Update**, extract the new zip **over the same folder**, and it reloads itself within a minute.
        run: |
          gh release upload "$TAG" "midas-$TAG.zip" --clobber
          gh release view "$TAG" --json body -q .body > old.md
          { printf '%s\n\n' "$NOTES"; cat old.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
